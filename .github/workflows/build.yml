name: Build VPinFE (Cross-Platform)

on:
  push:
    branches: [ master, vpinfe-2.0, vpinfe-3.0 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, vpinfe-2.0, vpinfe-3.0 ]
  # Run the build by hand, on any branch, from the Actions tab. Nothing about the
  # packaging is exercised by the test suite - a wrong --add-data path is a missing
  # splash in a release artifact, not a red test - so being able to produce real
  # artifacts on all three runners without pushing a tag is how that gets checked.
  # The release jobs refuse to run this way; see their conditions.
  workflow_dispatch:

permissions:
  contents: write

# One run per branch. A second push supersedes the first rather than queueing behind
# it - a tag run is exempt, because cancelling one halfway leaves a partial release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    timeout-minutes: 30
    env:
      DOF_VERSION: latest
      DOF_REPO: vpinfe/libdof-python
      DMDUTIL_VERSION: latest
      DMDUTIL_REPO: vpinfe/libdmdutil-python
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Resolve DOF triplet
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ "$RUNNER_ARCH" == "X64" ]]; then
              echo "DOF_TRIPLET=linux-x64" >> "$GITHUB_ENV"
            elif [[ "$RUNNER_ARCH" == "ARM64" ]]; then
              echo "DOF_TRIPLET=linux-arm64" >> "$GITHUB_ENV"
            else
              echo "Unsupported Linux arch: $RUNNER_ARCH"
              exit 1
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "DOF_TRIPLET=win-x64" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "DOF_TRIPLET=macos-arm64" >> "$GITHUB_ENV"
          else
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
          fi
        shell: bash

      - name: Set VPinFE version from tag/commit
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VPINFE_VERSION="${GITHUB_REF_NAME}"
          else
            VPINFE_VERSION="dev-${GITHUB_SHA::7}"
          fi

          printf '%s\n' \
            '"""Build/version metadata for VPinFE."""' \
            '' \
            "VPINFE_VERSION = \"${VPINFE_VERSION}\"" \
            '' \
            'def get_version() -> str:' \
            '    return VPINFE_VERSION' \
            > common/vpinfe_version.py

          echo "VPINFE_VERSION=${VPINFE_VERSION}" >> "$GITHUB_ENV"
          echo "Using VPinFE version: ${VPINFE_VERSION}"
        shell: bash

      - name: Fetch DOF bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_dof_bundle.py \
            --repo "${DOF_REPO}" \
            --version "${DOF_VERSION}" \
            --triplet "${DOF_TRIPLET}" \
            --outdir third_party/dof
        shell: bash

      - name: Fetch libdmdutil bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_libdmdutil_bundle.py \
            --repo "${DMDUTIL_REPO}" \
            --version "${DMDUTIL_VERSION}" \
            --triplet "${DOF_TRIPLET}" \
            --outdir third_party/libdmdutil
        shell: bash

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Create Chromium directories (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p chromium/linux chromium/windows chromium/mac
        shell: bash

      - name: Create Chromium directories (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path chromium\linux,chromium\windows,chromium\mac

      # All four downloads below are ungoogled-chromium 152.0.7977.82. Its builds carry the
      # proprietary codecs, so H.264 and AAC video plays in the bundled browser. Keep the four
      # on one version when bumping: a theme is written against what the bundled browser
      # supports, and a capability that exists on one platform and not another is invisible
      # to whoever wrote it. The release tags differ by platform (the Linux builds end -1, the
      # Windows and macOS builds -1.1) but the browser inside is the same.
      - name: Download Linux Chromium
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          wget -O chromium/linux/chrome.tar.xz "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/152.0.7977.82-1/ungoogled-chromium-152.0.7977.82-1-x86_64_linux.tar.xz"
          tar xvf chromium/linux/chrome.tar.xz -C chromium/linux/
          mv chromium/linux/ungoogled-chromium-152.0.7977.82-1-x86_64_linux chromium/linux/chrome
          chmod +x chromium/linux/chrome/chrome

      - name: Download ARM Linux Chromium
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          wget -O chromium/linux/chrome.tar.xz "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/152.0.7977.82-1/ungoogled-chromium-152.0.7977.82-1-arm64_linux.tar.xz"
          tar xvf chromium/linux/chrome.tar.xz -C chromium/linux/
          mv chromium/linux/ungoogled-chromium-152.0.7977.82-1-arm64_linux chromium/linux/chrome
          chmod +x chromium/linux/chrome/chrome

      - name: Download Windows Chromium
        if: runner.os == 'Windows'
        run: |
          pwsh -Command "Invoke-WebRequest -Uri 'https://github.com/ungoogled-software/ungoogled-chromium-windows/releases/download/152.0.7977.82-1.1/ungoogled-chromium_152.0.7977.82-1.1_windows_x64.zip' -OutFile 'chromium/windows/chrome.zip' -UseBasicParsing"
          pwsh -Command "Expand-Archive -Path 'chromium/windows/chrome.zip' -DestinationPath 'chromium/windows'"
          pwsh -Command "Rename-Item -Path 'chromium/windows/ungoogled-chromium_152.0.7977.82-1.1_windows_x64' -NewName 'chrome-win'"
          pwsh -Command "Remove-Item 'chromium/windows/chrome.zip'"

      - name: Download Mac Chromium
        if: runner.os == 'macOS'
        run: |
          mkdir -p chromium
          curl -L -o chrome-mac.dmg "https://github.com/ungoogled-software/ungoogled-chromium-macos/releases/download/152.0.7977.82-1.1/ungoogled-chromium_152.0.7977.82-1.1_arm64-macos.dmg"
          hdiutil attach chrome-mac.dmg -mountpoint chrome-mac-volume -nobrowse -quiet
          cp -R chrome-mac-volume/Chromium.app chromium/Chromium.app
          hdiutil detach chrome-mac-volume -quiet
          rm -f chrome-mac.dmg

      # What ships is packaging/vpinfe.spec, not flags here. See its docstring.
      - name: Build app with PyInstaller
        run: pyinstaller packaging/vpinfe.spec
        shell: bash

      - name: Bundle Chromium into the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          # Not --add-data: an .app copied that way loses its executable bit and the
          # symlinks inside it, and will not launch.
          mkdir -p dist/VPinFE.app/Contents/Frameworks/chromium
          cp -R chromium/Chromium.app dist/VPinFE.app/Contents/Frameworks/chromium/Chromium.app
          chmod +x dist/VPinFE.app/Contents/Frameworks/chromium/Chromium.app/Contents/MacOS/Chromium
          rm -rf dist/VPinFE
        shell: bash

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      # Strip the quarantine and Finder attributes a runner leaves behind, sign, and wrap
      # the .app in the DMG a user actually downloads. The strip comes first: the Chromium
      # copied out of its DMG carries Finder info, which codesign refuses to sign over.
      # Identical for the full and slim builds, so it is written once and run twice.
      - name: Package the .app as a signed DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xattr -rc dist
          codesign --force --deep --sign - dist/VPinFE.app
          codesign --verify --verbose dist/VPinFE.app
          create-dmg \
            --volname "VPinFE" \
            --volicon "packaging/VPinFE.icns" \
            --background "packaging/DMG_background.png" \
            --window-pos 200 120 \
            --window-size 610 475 \
            --icon-size 100 \
            --icon "VPinFE.app" 175 190 \
            --hide-extension "VPinFE.app" \
            --app-drop-link 425 190 \
            "dist/VPinFE.dmg" \
            "dist/VPinFE.app"
        shell: bash

      - name: Copy Windows launcher
        if: runner.os == 'Windows'
        run: cp packaging/vpinfe.bat dist/vpinfe/
        shell: bash

      - name: Upload full build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: build-macos-arm64
          path: dist/VPinFE.dmg
          retention-days: 30

      - name: Upload full build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: build-linux-${{ runner.arch == 'X64' && 'x64' || 'arm64' }}
          path: dist/
          retention-days: 30

      - name: Upload full build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: build-win-x64
          path: dist/
          retention-days: 30

      # The same spec, minus Chromium. One step for all three platforms.
      - name: Build slim app with PyInstaller
        env:
          VPINFE_SLIM: "1"
        run: |
          rm -rf build dist
          pyinstaller packaging/vpinfe.spec
          # On macOS the spec produces both the COLLECT directory and the .app that
          # wraps it. Only the .app is shipped; leaving the directory doubles the DMG.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rm -rf dist/VPinFE
          fi
        shell: bash

      - name: Upload slim build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: build-linux-${{ runner.arch == 'X64' && 'x64' || 'arm64' }}-slim
          path: dist/
          retention-days: 30

      - name: Copy Windows launcher (slim)
        if: runner.os == 'Windows'
        run: cp packaging/vpinfe.bat dist/vpinfe/
        shell: bash

      - name: Upload slim build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: build-win-x64-slim
          path: dist/
          retention-days: 30


      # Strip the quarantine and Finder attributes a runner leaves behind, sign, and wrap
      # the .app in the DMG a user actually downloads. The strip comes first: the Chromium
      # copied out of its DMG carries Finder info, which codesign refuses to sign over.
      # Identical for the full and slim builds, so it is written once and run twice.
      - name: Package the .app as a signed DMG (macOS Slim)
        if: runner.os == 'macOS'
        run: |
          sudo xattr -rc dist
          codesign --force --deep --sign - dist/VPinFE.app
          codesign --verify --verbose dist/VPinFE.app
          create-dmg \
            --volname "VPinFE" \
            --volicon "packaging/VPinFE.icns" \
            --background "packaging/DMG_background.png" \
            --window-pos 200 120 \
            --window-size 610 475 \
            --icon-size 100 \
            --icon "VPinFE.app" 175 190 \
            --hide-extension "VPinFE.app" \
            --app-drop-link 425 190 \
            "dist/VPinFE.dmg" \
            "dist/VPinFE.app"
        shell: bash

      - name: Upload slim build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: build-macos-arm64-slim
          path: dist/VPinFE.dmg
          retention-days: 30

  release_bundle:
    timeout-minutes: 15
    # A hand-started run never releases, whatever it was started against - a tag can be
    # dispatched as readily as a branch, and "it only publishes on a tag push" should be
    # true by construction rather than by reading the ref.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: build-linux-x64
            triplet: linux-x64
          - artifact: build-linux-arm64
            triplet: linux-arm64
          - artifact: build-win-x64
            triplet: win-x64
          - artifact: build-macos-arm64
            triplet: macos-arm64
          - artifact: build-linux-x64-slim
            triplet: linux-x64-slim
          - artifact: build-linux-arm64-slim
            triplet: linux-arm64-slim
          - artifact: build-win-x64-slim
            triplet: win-x64-slim
          - artifact: build-macos-arm64-slim
            triplet: macos-arm64-slim

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.triplet }}

      - name: Create tagged release zip
        run: |
          mkdir -p release
          if [[ "${{ matrix.triplet }}" == linux-* ]]; then
            # Artifact download/extract can lose executable bits; restore Linux launch binaries.
            find "staging/${{ matrix.triplet }}" -type f -name vpinfe -exec chmod 755 {} +
            while IFS= read -r chrome_root; do
              find "$chrome_root" -type d -exec chmod 755 {} +
              for helper in chrome chrome_crashpad_handler chrome-sandbox nacl_helper nacl_helper_bootstrap; do
                if [[ -e "$chrome_root/$helper" ]]; then
                  chmod 755 "$chrome_root/$helper"
                fi
              done
            done < <(find "staging/${{ matrix.triplet }}" -type d -path '*/_internal/chromium/linux/chrome')
          fi
          cd staging/${{ matrix.triplet }}
          zip -r ../../release/vpinfe-${GITHUB_REF_NAME}-${{ matrix.triplet }}.zip .

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-zip-${{ matrix.triplet }}
          path: release/vpinfe-${{ github.ref_name }}-${{ matrix.triplet }}.zip

  publish_release:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'
    needs: release_bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download release zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-zip-*
          path: release
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd release
          sha256sum vpinfe-${GITHUB_REF_NAME}-*.zip > checksums.txt

      - name: Generate manifest.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          release_dir = Path("release")
          assets = {}

          for zip_path in sorted(release_dir.glob(f"vpinfe-{tag}-*.zip")):
              name = zip_path.name
              prefix = f"vpinfe-{tag}-"
              triplet = name[len(prefix):-4]
              sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              assets[triplet] = {
                  "file": name,
                  "sha256": sha,
              }

          manifest = {
              "version": tag,
              "assets": assets,
          }

          (release_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/vpinfe-${GITHUB_REF_NAME}-*.zip
            release/checksums.txt
            release/manifest.json
          )

          # A tag with a suffix (-beta.N, -rc.N) publishes as a prerelease. The
          # in-app updater on the stable channel asks /releases/latest, which
          # GitHub defines as the newest non-prerelease, so only installs set to
          # the beta channel are offered these.
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${flags[@]}"
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag "${flags[@]}"
          fi
