  "tests/theming/test_players_drive.py",
  "tests/theming/test_separation.py",
]

# The frontend: what core draws, themes, and the wheel.
[[area]]
paths = ["frontend/*", "common/online/*"]
tests = [
  "tests/js/test_frontend_suite.py",
  "tests/theming/test_attract_drive.py",
  "tests/theming/test_browser_probe_drive.py",
  "tests/theming/test_core_defaults_drive.py",
  "tests/theming/test_core_playfield_media_drive.py",
  "tests/theming/test_core_topper_drive.py",
  "tests/theming/test_frontend_reports_drive.py",
  "tests/theming/test_late_window_drive.py",
  "tests/theming/test_picker_index_drive.py",
  "tests/theming/test_render_smoke.py",
  "tests/theming/test_theme_locales_drive.py",
