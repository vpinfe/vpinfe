# The HTTP API, which the Manager, the frontend and the Remote all call.
[[area]]
paths = ["httpapi/*"]
tests = [
  "tests/theming/test_remote_target_drive.py",
  "tests/theming/test_render_smoke.py",
  "tests/theming/test_separation.py",
  "tests/theming/test_sign_in_drive.py",
]

# Anything that boots the app: a change anywhere in it adds a Manager drive, a grid drive and
# the wizard's. `floor` adds these tests without accounting for the file, so a module nothing
# else reaches still selects the whole suite.
[[area]]
floor = true
paths = ["main.py", "common/*", "httpapi/*", "manager/*", "frontend/*", "apps/*"]
tests = [
  "tests/theming/test_grid_selection_drive.py",
  "tests/theming/test_pane_reopen_drive.py",
  "tests/theming/test_wizard_frame_drive.py",
]
