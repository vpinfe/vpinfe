# What `python -m tests --affected` runs for files that imports cannot connect to a test:
# data files that are read, not imported, and the browser drives, which start the app in a
# subprocess. `paths` are globs on repo-relative file names (`*` crosses folders); `tests` are
# files under tests/. The invariants always run and need no entry. A file matching no area
# here and reached by no import selects the whole suite.
#
# Every module that opens a BrowserSession appears in at least one area
# (tests/invariants/test_affected.py). A drive appears under every area it exercises, so a
# change there runs it. The last area is the floor for anything that boots the app.
# A file read by a test but not imported by it belongs here too: the guides, the theme docs,
# the catalogs and the Node tests.

# Prose nothing reads but the invariants, which always run.
[[area]]
paths = ["docs/*", "*.md"]
tests = []

# The theme docs, whose examples the Node tests run, and the extension guide, whose lessons
# are executed.
[[area]]
paths = ["docs/theme.md", "docs/theme-contract-1.md", "docs/compatibility-3.0.md"]
tests = ["tests/js/test_frontend_suite.py"]

[[area]]
paths = ["docs/extensions/*"]
tests = [
  "tests/extensions/test_guide.py",
  "tests/extensions/test_os_channel.py",
  "tests/extensions/test_tiers.py",
]

# What each desktop prints about its screens, which the display probes' tests read, and the
# script that records it.
[[area]]
paths = ["tests/fixtures/displays/*", "scripts/capture-display-fixtures.sh"]
tests = [
  "tests/supportpackage/test_display_compare.py",
  "tests/supportpackage/test_display_probes.py",
  "tests/supportpackage/test_display_section.py",
]

# The Node tests and the files they load.
[[area]]
paths = ["tests/js/*"]
tests = ["tests/js/test_frontend_suite.py"]

[[area]]
paths = ["common/i18n/catalogs/*"]
tests = [
  "tests/js/test_frontend_suite.py",
  "tests/config/test_i18n_script.py",
  "tests/extensions/test_catalogs.py",
  "tests/host/test_about.py",
  "tests/theming/test_pseudo_locale.py",
  "tests/theming/test_theme_locales_drive.py",
]

# The Manager's shared widgets, dialogs and shell.
[[area]]
paths = ["manager/kit/*", "manager/page.py", "manager/edit_page.py", "manager/static/*"]
tests = [
  "tests/manager/test_a_select_leaves_room_for_reset.py",
  "tests/manager/test_external_link_keeps_browser_menu.py",
  "tests/manager/test_open_links_in.py",
  "tests/theming/test_a_value_change_keeps_the_panel_drive.py",
  "tests/theming/test_escape_in_dialogs_drive.py",
  "tests/theming/test_folder_picker_drive.py",
  "tests/theming/test_identifier_ink.py",
  "tests/theming/test_manager_pages_drive.py",
  "tests/theming/test_nav_rail_width_drive.py",
  "tests/theming/test_panel_pages_stack_drive.py",
  "tests/theming/test_pseudo_locale.py",
  "tests/theming/test_remote_stars_drive.py",
  "tests/theming/test_support_dialog_drive.py",
]

# Library: the grids, panels, collections and their rows.
[[area]]
paths = ["manager/library/*", "manager/workbench/*", "common/games/*", "common/media/*"]
tests = [
  "tests/theming/test_a_value_change_keeps_the_panel_drive.py",
  "tests/theming/test_collection_adds_drive.py",
  "tests/theming/test_collection_panel_drive.py",
  "tests/theming/test_discovery_shelves_drive.py",
  "tests/theming/test_grid_layout_drive.py",
  "tests/theming/test_grid_selection_drive.py",
  "tests/theming/test_list_columns_drive.py",
  "tests/theming/test_manager_pages_drive.py",
  "tests/theming/test_media_fill_drive.py",
  "tests/theming/test_pane_reopen_drive.py",
  "tests/theming/test_private_drive.py",
  "tests/theming/test_record_lines_drive.py",
  "tests/theming/test_row_drag_drive.py",
  "tests/theming/test_vpx_settings_in_place_drive.py",
